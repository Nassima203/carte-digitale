<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte digitale</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="brand">
    <span class="brand__mark">✳</span>
    <span id="brand-name"></span>
  </div>

  <main class="card" id="card">
    <img class="card__photo" id="photo" src="" alt="Photo de profil" />
    <p class="card__label">Retrouve-moi ici</p>
    <h1 class="card__name" id="name"></h1>

    <a class="btn btn--primary" id="cv-btn" href="#" download>
      ⬇ Télécharger mon CV
    </a>

    <div class="link-list" id="links"></div>
  </main>

  <script src="config.js"></script>
  <script>
    const cfg = window.CARD_CONFIG;

    document.getElementById("photo").src = cfg.photo;
    document.getElementById("name").textContent = cfg.name;

    const [firstName, ...rest] = cfg.name.split(" ");
    document.getElementById("brand-name").innerHTML =
      `<span class="brand__name">${firstName}</span> <span class="brand__dot">.</span> <span class="brand__last">${rest.join(" ")}</span>`;

    const cvBtn = document.getElementById("cv-btn");
    cvBtn.href = cfg.cv;
    cvBtn.download = cfg.cvFileName || "cv.pdf";

    const links = document.getElementById("links");
    (cfg.links || []).forEach((link) => {
      const a = document.createElement("a");
      a.className = "link-item";
      a.href = link.href;
      if (link.href.startsWith("http")) {
        a.target = "_blank";
        a.rel = "noopener";
      }
      a.innerHTML = `<span class="link-item__icon">${link.icon}</span><span class="link-item__label">${link.label}</span>`;
      links.appendChild(a);
    });
  </script>
</body>
</html>
