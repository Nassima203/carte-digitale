<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Carte à partager (QR code)</title>
  <link rel="stylesheet" href="styles.css" />
  <script src="vendor/qrcode.min.js"></script>
</head>
<body>
  <a class="brand" id="brand" href="#" target="_blank" rel="noopener">
    <span class="brand__mark">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round">
        <line x1="12" y1="2" x2="12" y2="22" />
        <line x1="3.5" y1="7" x2="20.5" y2="17" />
        <line x1="20.5" y1="7" x2="3.5" y2="17" />
      </svg>
    </span><span id="brand-name"></span>
  </a>

  <div class="qr-page">
    <main class="card">
      <img class="card__photo" id="photo" src="" alt="Photo de profil" />
      <h1 class="card__name" id="name"></h1>
    </main>

    <div class="qr-box" id="qrcode"></div>
    <p class="qr-hint">
      Scannez ce QR code pour accéder à mes liens (portfolio, LinkedIn,
      GitHub, Gmail) et télécharger mon CV.
    </p>
  </div>

  <script src="config.js"></script>
  <script>
    const cfg = window.CARD_CONFIG;

    document.getElementById("photo").src = cfg.photo;
    document.getElementById("name").textContent = cfg.name;

    const brand = document.getElementById("brand");
    brand.href = cfg.portfolioUrl || "#";
    const [firstName, ...rest] = cfg.name.split(" ");
    document.getElementById("brand-name").innerHTML =
      `${firstName}<span class="brand__dot">.</span>${rest.join(" ")}`;

    new QRCode(document.getElementById("qrcode"), {
      text: cfg.cardUrl,
      width: 200,
      height: 200,
      colorDark: "#201510",
      colorLight: "#fffdf6",
      correctLevel: QRCode.CorrectLevel.H,
    });
  </script>
</body>
</html>
